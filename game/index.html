<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KARANG BAY — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e13;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace, sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #10141b;
    image-rendering: pixelated;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="KARANG BAY game canvas"></canvas>
</div>
<div id="status" aria-live="polite"></div>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/input.js"></script>
<script src="src/city.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/audio.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
